<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOTOR LAND — Отправка в другой город</title>
  <style>
    @page {
      size: 297mm 210mm;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ml-red: #c8102e;
      --ml-red-deep: #8b0a1e;
      --ml-black: #0a0a0a;
      --ml-ink: #1a1a1a;
      --ml-muted: #5a5a5a;
      --ml-line: #2a2a2a;
      --ml-paper: #f7f4ef;
      --ml-warm: #ebe6de;
    }

    html, body {
      height: 100%;
      background: #2a2a2a;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ml-ink);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .toolbar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .toolbar button {
      appearance: none;
      border: none;
      background: var(--ml-red);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 12px 20px;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .toolbar button:hover {
      background: var(--ml-red-deep);
    }

    .sheet {
      width: 297mm;
      height: 210mm;
      margin: 24px auto;
      background: var(--ml-paper);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    /* Outer frame */
    .sheet::before {
      content: "";
      position: absolute;
      inset: 10mm;
      border: 1.5px solid var(--ml-red);
      pointer-events: none;
      z-index: 3;
    }

    .sheet::after {
      content: "";
      position: absolute;
      inset: 11.5mm;
      border: 0.5px solid rgba(26, 26, 26, 0.35);
      pointer-events: none;
      z-index: 3;
    }

    /* Corner marks */
    .corner {
      position: absolute;
      width: 18mm;
      height: 18mm;
      z-index: 4;
      pointer-events: none;
    }

    .corner span {
      position: absolute;
      background: var(--ml-red);
    }

    .corner .h { height: 2px; width: 100%; }
    .corner .v { width: 2px; height: 100%; }

    .corner.tl { top: 7mm; left: 7mm; }
    .corner.tr { top: 7mm; right: 7mm; }
    .corner.bl { bottom: 7mm; left: 7mm; }
    .corner.br { bottom: 7mm; right: 7mm; }

    .corner.tr .h, .corner.br .h { right: 0; left: auto; }
    .corner.tr .v, .corner.br .v { right: 0; left: auto; }
    .corner.bl .h, .corner.br .h { bottom: 0; top: auto; }
    .corner.bl .v, .corner.br .v { bottom: 0; top: auto; }

    /* Watermark */
    .watermark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
      pointer-events: none;
    }

    .watermark img {
      width: 170mm;
      height: auto;
      opacity: 0.11;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      padding: 18mm 22mm 16mm;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 8mm;
      border-bottom: 2px solid var(--ml-red);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      width: 36mm;
      height: 36mm;
      object-fit: contain;
      border: none;
      outline: none;
      box-shadow: none;
      background: transparent;
    }

    .brand-text strong {
      display: block;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--ml-black);
      line-height: 1.1;
    }

    .brand-text span {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ml-muted);
    }

    .doc-meta {
      text-align: right;
    }

    .doc-meta .label {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ml-red);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .doc-meta h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--ml-black);
      line-height: 1;
    }

    .doc-meta p {
      margin-top: 6px;
      font-size: 12px;
      color: var(--ml-muted);
      letter-spacing: 0.04em;
    }

    .intro {
      margin-top: 7mm;
      max-width: 180mm;
      font-size: 13px;
      line-height: 1.45;
      color: var(--ml-muted);
    }

    .fields {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 11mm;
      padding: 6mm 8mm 2mm;
    }

    .field {
      display: grid;
      grid-template-columns: 48mm 1fr;
      align-items: end;
      gap: 8mm;
      min-height: 18mm;
    }

    .field-label {
      padding-bottom: 3mm;
      border-bottom: 2px solid transparent;
    }

    .field-label .ru {
      display: block;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ml-black);
      line-height: 1.1;
    }

    .field-label .hint {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ml-muted);
      text-transform: uppercase;
    }

    .field-line {
      position: relative;
      height: 16mm;
      border-bottom: 2px solid var(--ml-line);
    }

    .field-line::before {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 8mm;
      height: 2px;
      background: var(--ml-red);
    }

    .field-line::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 7mm;
      border-bottom: 1px dashed rgba(42, 42, 42, 0.18);
    }

    .footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      padding-top: 6mm;
      border-top: 1px solid rgba(26, 26, 26, 0.18);
    }

    .footer-left {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ml-muted);
      line-height: 1.6;
    }

    .footer-left strong {
      color: var(--ml-red);
      font-weight: 800;
    }

    .sign {
      width: 70mm;
    }

    .sign .cap {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ml-muted);
      margin-bottom: 10mm;
    }

    .sign .line {
      border-bottom: 1.5px solid var(--ml-line);
      height: 1px;
    }

    @media print {
      html, body {
        width: 297mm;
        height: 210mm;
        margin: 0;
        padding: 0;
        background: #f7f4ef;
        overflow: hidden;
      }

      .toolbar {
        display: none !important;
      }

      .sheet {
        position: fixed;
        top: 0;
        left: 0;
        width: 297mm;
        height: 210mm;
        margin: 0;
        box-shadow: none;
        overflow: hidden;
        page-break-after: avoid;
        break-after: avoid;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      .watermark img {
        width: 170mm;
      }
    }

    @media screen and (max-width: 1100px) {
      body {
        padding: 12px;
      }

      .sheet {
        width: 100%;
        height: auto;
        aspect-ratio: 297 / 210;
        margin: 64px auto 24px;
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Сохранить / Печать PDF</button>
  </div>

  <div class="sheet">
    <div class="corner tl"><span class="h"></span><span class="v"></span></div>
    <div class="corner tr"><span class="h"></span><span class="v"></span></div>
    <div class="corner bl"><span class="h"></span><span class="v"></span></div>
    <div class="corner br"><span class="h"></span><span class="v"></span></div>

    <div class="watermark" aria-hidden="true">
      <img src="logo-motor-land.png?v=4" alt="" />
    </div>

    <div class="content">
      <header class="header">
        <div class="brand">
          <img src="logo-motor-land.png?v=4" alt="MOTOR LAND" />
          <div class="brand-text">
            <strong>MOTOR LAND</strong>
            <span>Контрактные моторы и КПП</span>
          </div>
        </div>
        <div class="doc-meta">
          <div class="label">Междугородняя отправка</div>
          <h1>ОТПРАВКА</h1>
          <p>Заполните от руки при отправке</p>
        </div>
      </header>

      <section class="fields" aria-label="Поля для заполнения">
        <div class="field">
          <div class="field-label">
            <span class="ru">ФИО</span>
            <span class="hint">Получатель</span>
          </div>
          <div class="field-line" aria-hidden="true"></div>
        </div>

        <div class="field">
          <div class="field-label">
            <span class="ru">Телефон</span>
            <span class="hint">Номер получателя</span>
          </div>
          <div class="field-line" aria-hidden="true"></div>
        </div>

        <div class="field">
          <div class="field-label">
            <span class="ru">Город</span>
            <span class="hint">Куда отправляем</span>
          </div>
          <div class="field-line" aria-hidden="true"></div>
        </div>
      </section>

      <footer class="footer">
        <div class="footer-left">
          <div><strong>www.motor-land.kz</strong></div>
          <div>Продажа · Ремонт · Замена</div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
