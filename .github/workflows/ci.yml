name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs are split so one failure does not hide every other result.
#
# This was previously a single nine-step job. Step three (`npm run lint`) exited
# non-zero, and because steps run fail-fast, typecheck, design tokens, i18n,
# tests and build never executed at all — the pipeline reported one lint failure
# while six other gates silently never ran. Independent jobs mean a red linter
# still tells you whether the tests pass.
env:
  NODE_VERSION: "22"

jobs:
  secrets:
    name: Tracked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets
        run: node scripts/check-tracked-secrets.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  typecheck-mobile:
    name: Typecheck (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: autocore-mobile/package-lock.json
      # The mobile app is the largest surface in the repo and was excluded from
      # both the root tsconfig and CI, so type errors reached main unchallenged.
      - name: Install mobile dependencies
        working-directory: autocore-mobile
        run: npm ci
      - name: Typecheck mobile
        working-directory: autocore-mobile
        run: npm run typecheck

  functions:
    name: Build Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Billing and the Stripe webhook live here; a broken build is a broken
      # payment path, so it is verified rather than assumed.
      - name: Install functions dependencies
        working-directory: firebase/functions
        run: npm ci
      - name: Build functions
        working-directory: firebase/functions
        run: npm run build

  checks:
    name: Tokens and i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Design token check
        run: npm run tokens:check
      - name: i18n check
        run: npm run i18n:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install mobile dependencies
        working-directory: autocore-mobile
        run: npm ci
      - name: Scan normalize tests
        run: npm run test:scan
      # Discovery is by directory walk, not a hand-maintained list — a new
      # *.test.ts is picked up without a second edit to remember.
      - name: Unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          DOCUMENT_RENDER_SECRET: ci-build-render-secret-min-32-chars
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_APP_URL: https://app.example.com
          NEXT_PUBLIC_MARKETING_URL: https://example.com
