[package]
name = "autocore-desktop"
version = "0.1.0"
description = "AutoCore desktop application"
authors = ["AutoCore"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# Compact transport for document bytes over Tauri's JSON IPC — see commands.rs.
base64 = "0.22"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-deep-link = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2"
url = "2"

# Desktop-only: no meaning on the mobile targets the crate can also build for.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }
tauri-plugin-updater = "2.10"
tauri-plugin-window-state = "2.4"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-siwa = "1.0.0"
